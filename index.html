<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NFT Marker Creator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="home" id="app">
    
    <!-- Options Menu (always visible and horizontal) -->
    <div class="options-row" id="optionsPanel">
      <div class="option-group">
        <label>Filename</label>
        <input type="text" id="filenameInput" placeholder="myMarker" />
      </div>
      <div class="option-group">
        <label><input type="checkbox" name="zft" /> zft</label>
      </div>
      <div class="option-group">
        <label>dpi</label>
        <input type="number" name="dpi" value="72" min="1" max="999" />
      </div>
      <div class="option-group">
        <label>level</label>
        <input type="number" name="level" value="2" min="0" max="4" />
      </div>
      <div class="option-group">
        <label>leveli</label>
        <input type="number" name="leveli" value="1" min="0" max="3" />
      </div>
      <div class="option-group">
        <label>sd_thresh</label>
        <input type="number" name="sd_thresh" value="8" min="6" max="12" />
      </div>
      <div class="option-group">
        <label>max_thresh</label>
        <input type="number" step="0.01" name="max_thresh" value="0.9" min="0.8" max="0.98" />
      </div>
      <div class="option-group">
        <label>min_thresh</label>
        <input type="number" step="0.01" name="min_thresh" value="0.55" min="0.45" max="0.7" />
      </div>
      <div class="option-group">
        <label>feature_density</label>
        <input type="number" name="feature_density" value="70" min="70" max="200" />
      </div>
    </div>

    <!-- File Upload + Canvas + Generate -->
    <div class="row">
      <div class="upload_container">
        <div class="file-wrapper" id="fileDropArea">
          <input id="fileInput" type="file" accept="image/*" />
          Click or drag image here.
        </div>
      </div>

      <canvas class="canvas_preview" id="canvasPreview"></canvas>
      <canvas id="canvasImage" style="display:none;"></canvas>

      <button class="generateButton" id="generateButton" disabled>Generate</button>
    </div>

    <!-- Clear Button -->
    <div class="row">
      <button class="clearButton" id="clearButton" disabled>Clear Image</button>
    </div>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
